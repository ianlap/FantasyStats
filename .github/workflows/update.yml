name: Update league data and deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # UTC crons chosen to land safely after each game window in both EDT and EST.
    - cron: "0 11 * * *"   # daily morning refresh (~6-7am ET)
    - cron: "45 21 * * 0"  # Sunday, after the 1pm ET games
    - cron: "45 0 * * 1"   # Sunday, after the late-afternoon games
    - cron: "45 4 * * 1"   # after Sunday Night Football
    - cron: "45 4 * * 2"   # after Monday Night Football
    - cron: "45 4 * * 5"   # after Thursday Night Football

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Determine season
        id: season
        # NFL seasons are named for the year they start in (September).
        run: |
          MONTH=$(date -u +%m)
          YEAR=$(date -u +%Y)
          if [ "$MONTH" -ge 9 ]; then SEASON=$YEAR; else SEASON=$((YEAR - 1)); fi
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"

      - name: Pull latest data from ESPN
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: |
          if [ -z "$ESPN_S2" ] || [ -z "$SWID" ]; then
            echo "ESPN_S2/SWID secrets not configured — building from committed data only."
          else
            uv run python -m pipeline.pull --season "${{ steps.season.outputs.season }}"
          fi

      - name: Run tests
        run: uv run pytest -q

      - name: Build site data
        run: uv run python -m pipeline.build --season "${{ steps.season.outputs.season }}"

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Data refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
